name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      - name: install public SDK surface (dummy provider only)
        run: |
          python -m pip install --disable-pip-version-check --no-deps pip==26.1.2
          python -m pip install --require-hashes -r .github/requirements-ci.lock
      - run: python -m ruff check examples tests
      - run: python -m pytest tests -q
